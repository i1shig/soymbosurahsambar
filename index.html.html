<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Монгол бичиг сурахад зориулсан интерактив quiz, үсгийн сан, XP болон level системтэй сургалтын сайт.">
<meta name="keywords" content="монгол бичиг, соёмбо, mongolian script, quiz, монгол үсэг">

<meta property="og:description" content="Монгол бичгийн үсэг, тоо, quiz game, XP болон level системтэй сургалтын сайт.">

<style>
:root{
  --bg:#08111f;
  --bg-soft:#11203a;
  --panel:rgba(10, 22, 42, 0.84);
  --panel-strong:#0d1d35;
  --line:rgba(255,255,255,0.12);
  --text:#eef3fb;
  --muted:#adc2df;
  --gold:#f6ca67;
  --gold-strong:#ffd977;
  --accent:#71d7c7;
  --shadow:0 18px 60px rgba(0,0,0,0.35);
  --radius:24px;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:"Segoe UI","Noto Sans",sans-serif;
  background:
    radial-gradient(circle at top left, rgba(246,202,103,0.18), transparent 34%),
    radial-gradient(circle at right 20%, rgba(113,215,199,0.14), transparent 30%),
    linear-gradient(160deg, #07101d 0%, #0b1830 48%, #112549 100%);
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size:28px 28px;
  mask-image:linear-gradient(to bottom, rgba(0,0,0,0.35), transparent 75%);
}

.shell{
  width:min(1180px, calc(100% - 32px));
  margin:24px auto;
}

.hero{
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:32px;
  padding:28px;
  background:linear-gradient(135deg, rgba(7,17,31,0.92), rgba(17,32,58,0.82));
  box-shadow:var(--shadow);
}

.hero::after{
  content:"";
  position:absolute;
  right:-80px;
  top:-80px;
  width:240px;
  height:240px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(246,202,103,0.25), transparent 72%);
}

.hero-top{
  display:flex;
  justify-content:space-between;
  gap:18px;
  align-items:flex-start;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  border-radius:999px;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.08);
  color:var(--gold);
  font-size:14px;
  letter-spacing:0.08em;
  text-transform:uppercase;
}

h1{
  margin:16px 0 10px;
  font-size:clamp(34px, 7vw, 68px);
  line-height:0.95;
  letter-spacing:0.04em;
}

.lead{
  max-width:700px;
  margin:0;
  color:var(--muted);
  font-size:18px;
  line-height:1.7;
}

.hero-grid{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:18px;
  margin-top:24px;
}

.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
  backdrop-filter:blur(12px);
}

.stats{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:14px;
}

.stat{
  padding:16px;
  border-radius:20px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.06);
}

.stat strong{
  display:block;
  font-size:28px;
  color:var(--gold-strong);
}

.stat span{
  display:block;
  margin-top:6px;
  color:var(--muted);
  font-size:14px;
}

.quote{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.quote p{
  margin:0;
  font-size:18px;
  line-height:1.7;
}

.quote small{
  margin-top:16px;
  color:var(--accent);
  letter-spacing:0.08em;
  text-transform:uppercase;
}

.nav{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin:20px 0 18px;
}

.nav button,
.filter-chip,
.letter-btn,
.action-btn,
.tab-btn{
  border:none;
  cursor:pointer;
  transition:transform .18s ease, background .18s ease, border-color .18s ease, color .18s ease;
}

.nav button{
  padding:12px 18px;
  border-radius:999px;
  background:rgba(255,255,255,0.06);
  color:var(--text);
  border:1px solid transparent;
  font-weight:700;
}

.nav button.active,
.nav button:hover,
.filter-chip.active,
.filter-chip:hover,
.tab-btn.active,
.tab-btn:hover{
  background:linear-gradient(135deg, rgba(246,202,103,0.22), rgba(113,215,199,0.16));
  border-color:rgba(246,202,103,0.3);
  color:var(--gold-strong);
  transform:translateY(-1px);
}

.workspace{
  display:grid;
  grid-template-columns:1.1fr 0.9fr;
  gap:18px;
}

.progress-rail{
  width:100%;
  height:12px;
  border-radius:999px;
  background:rgba(255,255,255,0.08);
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.06);
}

.progress-fill{
  height:100%;
  width:0;
  border-radius:999px;
  background:linear-gradient(90deg, var(--accent), var(--gold-strong));
  transition:width .25s ease;
}

.progress-fill.level{
  background:linear-gradient(90deg, #ffb347, #ffd977);
}

.section-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  margin-bottom:16px;
}

.section-head h2,
.section-head h3{
  margin:0;
}

.section-head p{
  margin:6px 0 0;
  color:var(--muted);
}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:14px 0 18px;
}

.search{
  flex:1 1 220px;
  min-width:200px;
  padding:13px 16px;
  border-radius:16px;
  border:1px solid var(--line);
  background:rgba(255,255,255,0.05);
  color:var(--text);
  outline:none;
}

.search::placeholder{color:#91a5c4}

.filter-chip,
.tab-btn{
  padding:12px 16px;
  border-radius:14px;
  background:rgba(255,255,255,0.04);
  color:var(--muted);
  border:1px solid var(--line);
  font-weight:600;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(84px, 1fr));
  gap:12px;
}

.letter-btn{
  min-height:88px;
  border-radius:20px;
  background:linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
  border:1px solid rgba(255,255,255,0.08);
  color:var(--text);
  font-size:28px;
  font-weight:700;
}

.letter-btn:hover,
.letter-btn.active{
  transform:translateY(-2px);
  background:linear-gradient(180deg, rgba(246,202,103,0.22), rgba(255,255,255,0.05));
  border-color:rgba(246,202,103,0.28);
  color:var(--gold-strong);
}

.letter-meta{
  display:block;
  margin-top:6px;
  min-height:0;
}

.merged-note{
  margin-top:10px;
  color:var(--muted);
  font-size:14px;
  text-align:center;
}

.merged-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:12px;
  margin-top:18px;
}

.detail-card{
  background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
}

.script{
  font-family:"Mongolian Baiti","Noto Sans Mongolian","Mongolian White",serif;
  writing-mode:vertical-rl;
  text-orientation:mixed;
  color:var(--gold-strong);
}

.big-script{
  font-size:66px;
  min-height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px 0;
}


.forms{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:12px;
  margin-top:18px;
}

.form-box,
.mini-card{
  border-radius:18px;
  padding:16px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.06);
}

.form-box h4,
.mini-card h4{
  margin:0 0 10px;
  color:var(--muted);
  font-size:13px;
  letter-spacing:0.08em;
  text-transform:uppercase;
}

.combos{
  margin-top:18px;
}

.combo-output{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:12px;
  margin-top:14px;
}

.digits-grid{
  display:grid;
  grid-template-columns:repeat(5, 1fr);
  gap:12px;
}

.digit-card{
  text-align:center;
  border-radius:18px;
  padding:16px 10px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.06);
}

.digit-card strong{
  font-size:22px;
}

.digit-card .script{
  font-size:34px;
  height:68px;
  display:flex;
  justify-content:center;
  align-items:center;
  writing-mode:horizontal-tb;
  text-orientation:mixed;
}

.empty{
  color:var(--muted);
  text-align:center;
  padding:26px 12px;
  border:1px dashed rgba(255,255,255,0.14);
  border-radius:18px;
}

.action-btn{
  padding:13px 16px;
  width:100%;
  border-radius:16px;
  background:linear-gradient(135deg, rgba(246,202,103,0.24), rgba(113,215,199,0.18));
  color:var(--text);
  border:1px solid rgba(246,202,103,0.26);
  font-weight:700;
  margin-top:18px;
}

.action-btn:hover{transform:translateY(-1px)}

.quiz-card{
  padding:20px;
  border-radius:22px;
  background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
  border:1px solid rgba(255,255,255,0.06);
}

.quiz-top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  margin-bottom:18px;
}

.quiz-meta{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.pill{
  padding:10px 14px;
  border-radius:999px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  color:var(--muted);
  font-weight:700;
}

.pill.gold{
  color:var(--gold-strong);
  border-color:rgba(246,202,103,0.22);
  background:rgba(246,202,103,0.08);
}

.question-box{
  border-radius:20px;
  padding:20px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.07);
}

.question-box h3,
.question-box p{
  margin:0;
}

.question-box p{
  color:var(--muted);
  margin-top:8px;
}

.rank-sticker{
  margin:18px auto 10px;
  width:min(100%, 360px);
  padding:20px 24px;
  border-radius:28px;
  text-align:center;
  background:linear-gradient(135deg, rgba(246,202,103,0.24), rgba(113,215,199,0.2));
  border:1px solid rgba(246,202,103,0.28);
  box-shadow:0 12px 30px rgba(0,0,0,0.22);
}

.rank-sticker strong{
  display:block;
  font-size:42px;
  line-height:1;
  color:var(--gold-strong);
}

.rank-sticker span{
  display:block;
  margin-top:8px;
  font-size:16px;
  color:var(--text);
  letter-spacing:0.08em;
  text-transform:uppercase;
}

.quiz-prompt{
  margin:16px 0 6px;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:140px;
  text-align:center;
  font-size:42px;
  font-weight:700;
  color:var(--gold-strong);
}

.quiz-prompt.script{
  min-height:200px;
  font-size:84px;
  line-height:1;
}

.quiz-prompt.word{
  font-size:30px;
  line-height:1.3;
  letter-spacing:0.04em;
}

.quiz-options{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:12px;
  margin-top:16px;
}

.quiz-option{
  padding:16px;
  min-height:110px;
  border-radius:18px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  color:var(--text);
  font-size:18px;
  font-weight:700;
}

.quiz-option .script{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:72px;
  width:100%;
  font-size:56px;
  line-height:1;
}

.quiz-option .script.number-script,
.quiz-prompt.number-script{
  writing-mode:horizontal-tb;
  text-orientation:mixed;
}



.quiz-option:hover{
  transform:translateY(-1px);
  border-color:rgba(246,202,103,0.3);
}

.quiz-option.correct{
  background:rgba(113,215,199,0.18);
  border-color:rgba(113,215,199,0.45);
}

.quiz-option.wrong{
  background:rgba(255,112,112,0.16);
  border-color:rgba(255,112,112,0.42);
}

.feedback{
  min-height:30px;
  margin-top:14px;
  font-weight:700;
}

.feedback.good{color:var(--accent)}
.feedback.bad{color:#ff9494}

.feedback.xp{
  color:var(--gold-strong);
}

.quiz-actions{
  display:flex;
  gap:12px;
  margin-top:16px;
}

.secondary-btn{
  padding:13px 16px;
  border-radius:16px;
  background:rgba(255,255,255,0.05);
  color:var(--text);
  border:1px solid rgba(255,255,255,0.08);
  font-weight:700;
  cursor:pointer;
}

.secondary-btn:hover{transform:translateY(-1px)}

.footer-note{
  margin:18px 0 4px;
  color:var(--muted);
  text-align:center;
}

@media (max-width: 960px){
  .hero-grid,.workspace{grid-template-columns:1fr}
}

@media (max-width: 720px){
  .shell{width:min(100% - 20px, 1180px)}
  .hero{padding:20px}
  .hero-top{flex-direction:column}
  .stats,.forms,.combo-output,.digits-grid{grid-template-columns:1fr 1fr}
}

@media (max-width: 520px){
  .stats,.forms,.combo-output,.digits-grid{grid-template-columns:1fr}
  .nav{display:grid;grid-template-columns:1fr 1fr}
  .big-script{font-size:54px}
  .merged-grid{grid-template-columns:1fr}
  .quiz-options{grid-template-columns:1fr}
  .quiz-top,.quiz-actions{flex-direction:column;align-items:stretch}
  .quiz-prompt.script{font-size:68px;min-height:160px}
  .quiz-prompt.word{font-size:24px}
  .quiz-option .script{font-size:46px;min-height:64px}
}
</style>

}
</script>

    <section class="hero">

          <div class="badge">Mongol bichig</div>

  </main>

function saveProgress() {
  const payload = {
    player: state.player
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      return;
    }

    const parsed = JSON.parse(raw);
    if (parsed.player) {
      state.player = {
        ...state.player,
        ...parsed.player
      };
    }
  } catch (error) {
    console.warn("Progress load failed", error);
  }
}

function buildForms(letter) {
  const base = mongolianUnicode[letter] || "";

  if (letter === "Т") {
    return {
      initial: base + ZWJ,
      medial: ZWJ + "ᠳ" + ZWJ,
      medialWithVowel: ZWJ + base + ZWJ,
      final: ZWJ + "ᠳ"
    };
  }

  return {
    initial: base + ZWJ,
    medial: ZWJ + base + ZWJ,
    final: ZWJ + base
  };
}

function buildCombo(letter, vowel) {
  if (letter === "Т") {
    const v = mongolianUnicode[vowel] || "";
    const combo = "ᠲ" + ZWJ + v;
    return {
      initial: combo + ZWJ,
      medial: ZWJ + combo + ZWJ,
      final: ZWJ + combo
    };
  }

  const l = mongolianUnicode[letter] || "";
  const v = mongolianUnicode[vowel] || "";
  const combo = l + ZWJ + v;
  return {
    initial: combo + ZWJ,
    medial: ZWJ + combo + ZWJ,
    final: ZWJ + combo
  };
}

function getScriptSegment(char, position, nextChar = "") {
  const forms = buildForms(char);

  if (position === "initial") {
    return forms.initial;
  }

  if (position === "final") {
    return forms.final;
  }

  if (char === "Т") {
    return vowels.includes(nextChar) ? forms.medialWithVowel : forms.medial;
  }

  return forms.medial;
}

function toMongolianScript(text) {
  const chars = text.split("");

  if (chars.length === 1) {
    return mongolianUnicode[text] || text;
  }

  return chars.map((char, index) => {
    const position = index === 0 ? "initial" : index === chars.length - 1 ? "final" : "medial";
    return getScriptSegment(char, position, chars[index + 1] || "");
  }).join("");
}

function findConfusingGroup(text) {
  return confusingGroups.find((group) => group.some((char) => text.includes(char))) || null;
}

function findMergedDisplayGroup(text) {
  return mergedDisplayGroups.find((group) => group.some((char) => text.includes(char))) || null;
}

function getMergedDisplayLabel(text) {
  const group = findMergedDisplayGroup(text);
  return group ? group.join(",") : text;
}

function getMergedRepresentative(char) {
  const group = findMergedDisplayGroup(char);
  return group ? group[0] : char;
}

function getMergedMembers(char) {
  return findMergedDisplayGroup(char) || [char];
}

function getCatalogLetters() {
  const seen = new Set();
  return letters.filter((item) => {
    const key = getMergedRepresentative(item.char);
    if (seen.has(key)) {
      return false;
    }
    seen.add(key);
    return true;
  });
}

function renderFormValue(letter, forms, slot) {
  if (letter === "Т" && slot === "medial") {
    return `
      <div class="big-script script">${forms.medialWithVowel}</div>
      <div class="merged-note">Араас эгшиг орвол</div>
      <div class="big-script script">${forms.medial}</div>
      <div class="merged-note">Араас эгшиг орохгүй бол</div>
    `;
  }

  return `<div class="big-script script">${forms[slot]}</div>`;
}

function filterConfusingOptions(pool, answer) {
  const groups = confusingGroups.filter((group) => group.some((char) => answer.includes(char)));
  if (!groups.length) {
    return pool;
  }

  const blockedChars = new Set(groups.flat());
  return pool.filter((item) => !Array.from(blockedChars).some((char) => item.includes(char)));
}

function shuffle(array) {
  const copy = [...array];
  for (let i = copy.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function getLevelProgressPercent() {
  return Math.max(0, Math.min(100, Math.round((state.player.levelXp / state.player.nextLevelXp) * 100)));
}

function getQuizRank(score, total) {
  if (score === total) {
    return "Perfect";
  }

  if (score >= total - 1) {
    return "Excellent";
  }

  if (score >= Math.ceil(total * 0.7)) {
    return "Great";
  }

  if (score >= Math.ceil(total * 0.5)) {
    return "Good";
  }

  return "Keep going";
}

function awardXp(amount) {
  state.player.xp += amount;
  state.player.levelXp += amount;

  while (state.player.levelXp >= state.player.nextLevelXp) {
    state.player.levelXp -= state.player.nextLevelXp;
    state.player.level += 1;
    state.player.nextLevelXp = 100 + ((state.player.level - 1) * 20);
  }

  saveProgress();
}

function createQuizQuestion() {
  const roll = Math.random();
  const useNumber = roll < 0.2;
  const useWord = roll >= 0.2 && roll < 0.55;

  if (useNumber) {
    const picked = digits[Math.floor(Math.random() * digits.length)];
    const mode = Math.random() > 0.5 ? "number-to-script" : "script-to-number";
    const wrongPool = shuffle(digits.filter((item) => item.latin !== picked.latin)).slice(0, 3);
    const options = shuffle([picked, ...wrongPool]).map((item) => ({
      value: item.latin,
      script: item.mongol
    }));

    return {
      answer: picked.latin,
      mode,
      kind: "number",
      options
    };
  }

  if (useWord) {
    const picked = quizSyllables[Math.floor(Math.random() * quizSyllables.length)];
    const mode = Math.random() > 0.5 ? "word-to-script" : "script-to-word";
    const filteredPool = filterConfusingOptions(quizSyllables.filter((item) => item !== picked), picked);
    const sourcePool = filteredPool.length >= 3 ? filteredPool : quizSyllables.filter((item) => item !== picked);
    const wrongPool = shuffle(sourcePool).slice(0, 3);
    const options = shuffle([picked, ...wrongPool]).map((item) => ({
      value: item,
      script: toMongolianScript(item)
    }));

    return {
      answer: picked,
      mode,
      kind: "word",
      options
    };
  }

  const picked = letters[Math.floor(Math.random() * letters.length)];
  const mode = Math.random() > 0.5 ? "latin-to-script" : "script-to-latin";
  const filteredPool = filterConfusingOptions(
    letters.filter((item) => item.char !== picked.char).map((item) => item.char),
    picked.char
  );
  const sourcePool = filteredPool.length >= 3
    ? filteredPool.map((char) => letters.find((item) => item.char === char))
    : letters.filter((item) => item.char !== picked.char);
  const wrongPool = shuffle(sourcePool).slice(0, 3);
  const options = shuffle([picked, ...wrongPool]).map((item) => ({
    value: item.char,
    script: mongolianUnicode[item.char]
  }));

  return {
    answer: picked.char,
    mode,
    kind: "letter",
    options
  };
}

    streak: 0,
    answered: false,
    selectedIndex: null,
    question: createQuizQuestion(),
    finished: false,
    earnedXp: 0,
    lastXpGain: 0
  };
}

          <div class="pill">Оноо ${quiz.score}</div>
          <div class="pill">Streak ${quiz.streak}</div>
          <div class="pill gold">Level ${state.player.level}</div>
          <div class="pill gold">XP ${state.player.xp}</div>
        </div>
      </div>
      <div style="margin-bottom:16px;">
        <div class="progress-rail">
          <div class="progress-fill level" style="width:${getLevelProgressPercent()}%;"></div>
        </div>
        <p style="margin:8px 0 0;color:var(--muted);">Level ${state.player.level} · ${state.player.levelXp} / ${state.player.nextLevelXp} XP</p>
      </div>
      <div class="question-box">
        <h3>${promptLabel}</h3>
        <p>Зөв хариулт streak-ийг өсгөнө.</p>
        <div class="quiz-prompt ${promptClass}">${prompt}</div>
      </div>
      <div class="quiz-options">
        ${question.options.map((option, index) => {
          let className = "quiz-option";
          if (quiz.answered) {
            if (option.value === question.answer) {
              className += " correct";
            } else if (quiz.selectedIndex === index) {
              className += " wrong";
            }
          }

          const showScript = question.mode === "latin-to-script" || question.mode === "word-to-script" || question.mode === "number-to-script";
          const label = showScript
            ? option.script
            : question.kind === "letter"
              ? getMergedDisplayLabel(option.value)
              : option.value;
          const extraClass = showScript
            ? question.kind === "number"
              ? "script number-script"
              : "script"
            : "";
          return `<button class="${className}" type="button" data-option="${index}"><span class="${extraClass}">${label}</span></button>`;
        }).join("")}
      </div>
      <div class="feedback ${quiz.answered && question.options[quiz.selectedIndex]?.value === question.answer ? "good" : quiz.answered ? "bad" : ""}">
        ${quiz.answered
          ? question.options[quiz.selectedIndex]?.value === question.answer
            ? "Зөв байна. Сайн байна."
            : `Бараг дөхлөө. Зөв хариулт нь ${question.kind === "letter" ? getMergedDisplayLabel(question.answer) : question.answer} / ${question.kind === "word" ? toMongolianScript(question.answer) : question.kind === "number" ? digits.find((item) => item.latin === question.answer)?.mongol || question.answer : mongolianUnicode[question.answer]}.`
          : "Нэг сонголт дарж үргэлжлүүлээрэй."}
      </div>
      <div class="feedback xp">${quiz.answered && quiz.lastXpGain > 0 ? `+${quiz.lastXpGain} XP авлаа` : quiz.answered ? "Энэ асуултаас XP аваагүй." : ""}</div>
      <div class="quiz-actions">
        <button class="action-btn" type="button" id="next-question" ${quiz.answered ? "" : "disabled"}>${questionNumber === quiz.total ? "Дуусгах" : "Дараагийн асуулт"}</button>
        <button class="secondary-btn" type="button" id="restart-inline">Шинээр эхлэх</button>
      </div>
    </div>
  `;

  detailPanel.innerHTML = `
    <div class="section-head">
      <div>
        <h3>Тоглох заавар</h3>
        <p>Үсэг, үе, тоо болон Монгол бичгийн дүрсийг хооронд нь тааруулна.</p>
      </div>
    </div>
    <div class="mini-card">
      <h4>Яагаад хэрэгтэй вэ</h4>
      <p>Түргэн сонголттой асуултууд давтамж үүсгэж, таних хурдыг нэмэгдүүлдэг.</p>
    </div>
    <div class="mini-card" style="margin-top:12px;">
      <h4>XP дүрэм</h4>
      <p>Зөв хариулт бүр 10 XP. 3-аас дээш streak бүрт нэмэлт 5 XP bonus орно.</p>
    </div>
  `;

  document.querySelectorAll("[data-option]").forEach((button) => {
    button.addEventListener("click", () => {
      if (quiz.answered) {
        return;
      }

      quiz.selectedIndex = Number(button.dataset.option);
      quiz.answered = true;
      const correct = quiz.question.options[quiz.selectedIndex].value === quiz.question.answer;
      if (correct) {
        quiz.score += 1;
        quiz.streak += 1;
        quiz.lastXpGain = 10 + (quiz.streak >= 3 ? 5 : 0);
        quiz.earnedXp += quiz.lastXpGain;
        awardXp(quiz.lastXpGain);
        state.player.bestStreak = Math.max(state.player.bestStreak, quiz.streak);
        saveProgress();
      } else {
        quiz.streak = 0;
        quiz.lastXpGain = 0;
      }
      renderQuiz();
    });
  });

  document.getElementById("next-question").addEventListener("click", () => {
    if (!quiz.answered) {
      return;
    }

    quiz.current += 1;
    if (quiz.current >= quiz.total) {
      quiz.finished = true;
      quiz.question = null;
      state.player.lessonsCompleted += 1;
      saveProgress();
    } else {
      quiz.answered = false;
      quiz.selectedIndex = null;
      quiz.question = createQuizQuestion();
    }
    renderQuiz();
  });

  document.getElementById("restart-inline").addEventListener("click", () => {
    resetQuiz();
    renderQuiz();
  });
}

function renderProfile() {
  mainPanel.innerHTML = `
    <div class="section-head">
      <div>
        <h2>Ахицын самбар</h2>
        <p>Quiz тоглох тусам XP цугларч, level ахина.</p>
      </div>
    </div>
    <div class="forms">
      <div class="mini-card">
        <h4>Нийт XP</h4>
        <p><strong style="font-size:28px;color:var(--gold-strong);">${state.player.xp}</strong></p>
      </div>
      <div class="mini-card">
        <h4>Одоогийн level</h4>
        <p><strong style="font-size:28px;color:var(--gold-strong);">${state.player.level}</strong></p>
      </div>
      <div class="mini-card">
        <h4>Дуусгасан quiz</h4>
        <p><strong style="font-size:28px;color:var(--gold-strong);">${state.player.lessonsCompleted}</strong></p>
      </div>
      <div class="mini-card">
        <h4>Хамгийн өндөр streak</h4>
        <p><strong style="font-size:28px;color:var(--gold-strong);">${state.player.bestStreak}</strong></p>
      </div>
      <div class="mini-card">
        <h4>Дараагийн level</h4>
        <p>${state.player.levelXp} / ${state.player.nextLevelXp} XP</p>
        <div class="progress-rail" style="margin-top:12px;">
          <div class="progress-fill level" style="width:${getLevelProgressPercent()}%;"></div>
        </div>
      </div>
      <div class="mini-card">
        <h4>Өдрийн зорилт</h4>
        <p>${Math.max(0, 50 - (state.player.levelXp % 50))} XP цуглуулаад дараагийн milestone-д хүрээрэй.</p>
      </div>
    </div>
  `;

  detailPanel.innerHTML = `
    <div class="section-head">
      <div>
        <h3>Санал болгож буй нэмэлт</h3>
        <p>Энэ хэсгийг дараа нь бодит ахицтай холбож өргөтгөхөд бэлэн.</p>
      </div>
    </div>
    <div class="mini-card">
      <h4>Хийж болох сайжруулалт</h4>
      <p>Local storage нэмбэл XP, level, streak-ээ browser дээрээ хадгалж үлдээж болно.</p>
    </div>
  `;
}

function render() {
  if (state.page === "home") {
    renderHome();
    return;
  }

  if (state.page === "letters") {
    renderLetters();
    return;
  }

  if (state.page === "numbers") {
    renderNumbers();
    return;
  }

  if (state.page === "quiz") {
    renderQuiz();
    return;
  }

  renderProfile();
}

navButtons.forEach((button) => {
  button.addEventListener("click", () => setPage(button.dataset.page));
});

loadProgress();
resetQuiz();
render();
</script>
</body>
</html>
