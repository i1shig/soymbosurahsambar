<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07101d"/>
      <stop offset="48%" stop-color="#0b1830"/>
      <stop offset="100%" stop-color="#112549"/>
    </linearGradient>
    <radialGradient id="glow1" cx="10%" cy="10%" r="40%">
      <stop offset="0%" stop-color="#f6ca67" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f6ca67" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#71d7c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#71d7c7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Grid pattern -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
