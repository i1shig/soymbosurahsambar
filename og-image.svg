  <!-- Badge -->
  <rect x="80" y="80" width="200" height="40" rx="20" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="180" y="106" text-anchor="middle" fill="#f6ca67" font-size="14" font-family="Arial,sans-serif" letter-spacing="2" font-weight="600">MONGOL BICHIG</text>

  <!-- Main title -->
  <text x="80" y="220" fill="#eef3fb" font-size="72" font-family="Arial,sans-serif" font-weight="800" letter-spacing="2">Соёмбо</text>
  <text x="80" y="300" fill="#eef3fb" font-size="72" font-family="Arial,sans-serif" font-weight="800" letter-spacing="2">сурах самбар</text>

  <!-- Description -->
  <text x="80" y="360" fill="#adc2df" font-size="26" font-family="Arial,sans-serif">Монгол бичиг · Quiz · XP · Level систем</text>

  <!-- Stats pills -->
  <rect x="80" y="410" width="160" height="50" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="160" y="442" text-anchor="middle" fill="#ffd977" font-size="22" font-family="Arial,sans-serif" font-weight="700">23 үсэг</text>

  <rect x="260" y="410" width="160" height="50" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="340" y="442" text-anchor="middle" fill="#ffd977" font-size="22" font-family="Arial,sans-serif" font-weight="700">10 тоо</text>

  <rect x="440" y="410" width="220" height="50" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="550" y="442" text-anchor="middle" fill="#71d7c7" font-size="22" font-family="Arial,sans-serif" font-weight="700">Quiz game</text>

  <!-- Big script decoration -->
  <text x="950" y="480" text-anchor="middle" fill="#f6ca67" font-size="280" font-family="'Mongolian Baiti',serif" opacity="0.18" writing-mode="vertical-rl">ᠰᠣᠶᠣᠮᠪᠣ</text>

  <!-- URL -->
  <text x="80" y="580" fill="#adc2df" font-size="20" font-family="Arial,sans-serif" opacity="0.7">github.io/soymbo</text>
